{% extends 'base/base.html' %}
{% block title %}Adaugă pacient{% endblock %}
{% block content %}
<div class="tile">
  <h3 class="tile-title">Adaugă un pacient nou</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvează</button>
    <a href="{% url 'calendarapp:pacienti_list' %}" class="btn btn-secondary">Renunță</a>
  </form>
</div>
{% endblock %}
